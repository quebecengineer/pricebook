name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Public addresses, not secrets: where the app lives now, and the old address allowed to hand data over.
          VITE_APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          VITE_LEGACY_ORIGIN: ${{ vars.LEGACY_ORIGIN }}
      - name: No Google credentials in the app bundle
        run: |
          if grep -rElI 'GOCSPX-|AIza[0-9A-Za-z_-]{20,}|googleusercontent' dist; then
            echo "::error::dist/ contains a Google credential; those belong in Worker secrets only"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # The old address keeps getting updates, so existing installs see "Pricebook has moved" and can hand their data over.
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    needs: build
    if: vars.APP_ORIGIN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
